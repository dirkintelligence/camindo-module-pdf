module_label = "PDF"
module_description = "PDF documents from templates (CMS:PDF_PAGE, PDF_FONT, PDF_TEXT, PDF_PRINT)"

; ---------------------------------------------------------------------------
; Command reference (commands.php): shown in the command picker of the template
; input mask and exported for the VS Code extension.
;   cmd_{command}               note of the command
;   cmd_{command}__{parameter}  description of a parameter
;   cmdval_{hint}               expected value of a parameter
; Plain text (no HTML). Syntax hints such as "P / L" stay literal in commands.php.
; ---------------------------------------------------------------------------

cmd_pdf_init = "Defaults for the document: color space, ICC profile, page size and margins. Before the first CMS:PDF_PAGE."
cmd_pdf_init__colorspace = "Color space in which colors are written to the PDF."
cmd_pdf_init__icc_profile = "ICC profile from var/modules/pdf/profiles/, embedded as output intent."
cmd_pdf_init__output_condition = "Identifier of the print condition for the output intent (e.g. FOGRA39). If omitted, the file name of the profile."
cmd_pdf_init__format = "Page size of empty pages (names as in tc-lib-pdf)."
cmd_pdf_init__orientation = "Portrait (P) or landscape (L) for empty pages."
cmd_pdf_init__margins = "Page margins in mm (one value: all; two: top/bottom, right/left). Left margin = default for x, right margin = default for the width, bottom margin = page break limit of tables."
cmd_pdf_meta = "Document properties (written by CMS:PDF_PRINT)."
cmd_pdf_meta__title = "Title."
cmd_pdf_meta__author = "Author."
cmd_pdf_meta__subject = "Subject."
cmd_pdf_meta__keywords = "Keywords."
cmd_pdf_meta__creator = "Creating application."
cmd_pdf_page = "Adds a new page - empty or based on a page of a layout file. The first call starts the document."
cmd_pdf_page__layout = "PDF layout file from var/modules/pdf/layouts/ whose page is used as the background. If omitted, an empty page."
cmd_pdf_page__page = "Page of the layout file (from 1) to use."
cmd_pdf_page__format = "Page size of an empty page; otherwise the default from PDF_INIT."
cmd_pdf_page__orientation = "Orientation of an empty page; otherwise the default from PDF_INIT."
cmd_pdf_page__margins = "Margins of this page only; otherwise the default from PDF_INIT."
cmd_pdf_print = "Sends the document to the browser and ends the request. The template must not have produced any output before CMS:PDF_PAGE."
cmd_pdf_print__filename = "File name that the browser shows or suggests when saving."
cmd_pdf_print__download = "Empty or false: show in the browser. true: download as filename. A file name: download under this name."
cmd_pdf_font = "Sets the font for the following texts and cells. Applies across pages."
cmd_pdf_font__font = "Name of a font from var/modules/pdf/fonts/ ({name}.json; included: helvetica, times, courier, symbol, zapfdingbats). A file {name}.ttf/.otf is converted on the first call."
cmd_pdf_font__style = "Font style: B bold, I italic, U underlined, D strikethrough, O overline. Empty = regular."
cmd_pdf_font__size = "Font size in points."
cmd_pdf_color = "Defines a color field with an RGB and/or CMYK value. The color space of the document (PDF_INIT) selects the value; a missing one is converted."
cmd_pdf_color__name = "Name of the color field (letters, digits, _ and -)."
cmd_pdf_color__rgb = "RGB value as a hex color, e.g. #0066FF."
cmd_pdf_color__cmyk = "CMYK value in percent, e.g. 0,100,100,0."
cmd_pdf_text_color = "Text color for the following CMS:PDF_TEXT and cells. If omitted, black."
cmd_pdf_text_color__name = "Text color. Color field (PDF_COLOR), #rrggbb or c,m,y,k."
cmd_pdf_fill_color = "Fill color for the following CMS:PDF_RECT. If omitted, black."
cmd_pdf_fill_color__name = "Fill color. Color field (PDF_COLOR), #rrggbb or c,m,y,k."
cmd_pdf_line_color = "Line color for the following CMS:PDF_LINE, borders of CMS:PDF_RECT and cell borders. If omitted, black."
cmd_pdf_line_color__name = "Line color. Color field (PDF_COLOR), #rrggbb or c,m,y,k."
cmd_pdf_text = "Writes a text block with line wrapping within the width. The cursor moves below the block."
cmd_pdf_text__text = "The text (UTF-8; line breaks are kept). Empty = no output."
cmd_pdf_text__x = "Distance from the left page edge; if omitted, the left margin."
cmd_pdf_text__y = "Distance from the top page edge (top of the block); if omitted, the cursor."
cmd_pdf_text__width = "Width of the block; 0 = up to the right margin."
cmd_pdf_text__align = "Alignment: left, centered, right, justified."
cmd_pdf_text__size = "Font size for this block only; otherwise that of CMS:PDF_FONT."
cmd_pdf_text__color = "Text color for this block only; otherwise CMS:PDF_TEXT_COLOR. Color field (PDF_COLOR), #rrggbb or c,m,y,k."
cmd_pdf_text__background = "Background color of the block. Color field (PDF_COLOR), #rrggbb or c,m,y,k."
cmd_pdf_html = "Writes an HTML block (wrapping and page breaks by tc-lib-pdf). The cursor stays where it is - the height of the block is not known."
cmd_pdf_html__html = "The HTML code (text markup, lists, tables, inline CSS)."
cmd_pdf_html__x = "Distance from the left page edge; if omitted, the left margin."
cmd_pdf_html__y = "Distance from the top page edge; if omitted, the cursor."
cmd_pdf_html__width = "Width of the block; 0 = up to the right margin."
cmd_pdf_image = "Places an image (JPEG, PNG, GIF, ...) from the media directory. The cursor moves below the image."
cmd_pdf_image__file = "Image file: absolute path from (CMS:MEDIA subfield=file), web path from subfield=path or path relative to public/media. Only files below the media directory."
cmd_pdf_image__x = "Distance from the left page edge; if omitted, the left margin."
cmd_pdf_image__y = "Distance from the top page edge; if omitted, the cursor."
cmd_pdf_image__width = "Width; 0 = from the height (or from the pixels at 72 dpi if both are missing)."
cmd_pdf_image__height = "Height; 0 = proportional to the width."
cmd_pdf_image__link = "Link that opens when the image is clicked."
cmd_pdf_line = "Draws a line."
cmd_pdf_line__x1 = "Start point, distance from the left."
cmd_pdf_line__y1 = "Start point, distance from the top."
cmd_pdf_line__x2 = "End point, distance from the left."
cmd_pdf_line__y2 = "End point, distance from the top."
cmd_pdf_line__width = "Line thickness."
cmd_pdf_line__color = "Line color; otherwise CMS:PDF_LINE_COLOR. Color field (PDF_COLOR), #rrggbb or c,m,y,k."
cmd_pdf_rect = "Draws a rectangle, outlined and/or filled."
cmd_pdf_rect__x = "Left edge."
cmd_pdf_rect__y = "Top edge."
cmd_pdf_rect__width = "Width."
cmd_pdf_rect__height = "Height."
cmd_pdf_rect__style = "D border, F fill, DF both."
cmd_pdf_rect__color = "Fill color; otherwise CMS:PDF_FILL_COLOR. Color field (PDF_COLOR), #rrggbb or c,m,y,k."
cmd_pdf_rect__border = "Border color; otherwise CMS:PDF_LINE_COLOR. Color field (PDF_COLOR), #rrggbb or c,m,y,k."
cmd_pdf_rect__line_width = "Border thickness."
cmd_pdf_table = "Starts a table; rows and cells follow with CMS:PDF_ROW / CMS:PDF_CELL, drawing happens at CMS:PDF_TABLE_END. Rows are never split: what no longer fits on the page starts on a continuation page, where header rows are repeated."
cmd_pdf_table__cols = "Column widths in mm, comma-separated."
cmd_pdf_table__x = "Left edge; if omitted, the left margin."
cmd_pdf_table__y = "Top edge; if omitted, the cursor."
cmd_pdf_table__padding = "Padding of all cells in mm (one value: all; two: top/bottom, right/left)."
cmd_pdf_table__border_width = "Border thickness of the cells."
cmd_pdf_table__next_layout = "Layout file of continuation pages on a page break; otherwise as in the last CMS:PDF_PAGE (empty = empty page)."
cmd_pdf_table__next_page = "Page of the layout file for continuation pages."
cmd_pdf_row = "Starts a table row."
cmd_pdf_row__is_header = "Header row: repeated on the continuation page after a page break."
cmd_pdf_row__keep_together = "Do not split the row across pages. Currently rows are never split; the parameter is reserved for later versions."
cmd_pdf_cell = "Cell of the current row. The font is the one set at this point (CMS:PDF_FONT)."
cmd_pdf_cell__text = "Cell text; wraps within the column unless fit= fits it."
cmd_pdf_cell__col = "Column index from 0; if omitted, the next column."
cmd_pdf_cell__align = "Horizontal alignment."
cmd_pdf_cell__valign = "Vertical alignment in the row."
cmd_pdf_cell__fit = "Fit the text on one line within the column width: fontsize reduces the font size (down to min_size), spacing reduces the character spacing, scale does both, force compresses horizontally. What still does not fit wraps."
cmd_pdf_cell__min_size = "Smallest font size when fitting."
cmd_pdf_cell__border = "Border sides: L left, T top, R right, B bottom; 1 all, 0 none."
cmd_pdf_cell__border_width = "Border thickness; otherwise that of the table."
cmd_pdf_cell__border_color = "Border color; otherwise CMS:PDF_LINE_COLOR. Color field (PDF_COLOR), #rrggbb or c,m,y,k."
cmd_pdf_cell__padding = "Padding of this cell; otherwise that of the table."
cmd_pdf_cell__color = "Text color; otherwise CMS:PDF_TEXT_COLOR. Color field (PDF_COLOR), #rrggbb or c,m,y,k."
cmd_pdf_cell__background = "Background color of the cell. Color field (PDF_COLOR), #rrggbb or c,m,y,k."
cmd_pdf_table_end = "Draws the table. The cursor moves below the table."
